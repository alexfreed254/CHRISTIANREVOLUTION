services:
  - type: web
    name: christ-revolution-movement
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 100 app:app --bind 0.0.0.0:$PORT --timeout 120 --log-level info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.18.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: '*'
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_ANON_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
